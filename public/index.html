<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Entrar · SellFlow</title>
    <link rel="stylesheet" href="/styles/log-in.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-brand">
                <span class="login-logo" aria-hidden="true">SF</span>
                <div>
                    <h1>SellFlow</h1>
                    <p>Sistema de pedidos</p>
                </div>
            </header>

            <div class="login-heading">
                <h2 id="login-title">Bem-vindo(a)!</h2>
                <p>Faça login para acessar os pedidos da sua loja</p>
            </div>

            <form id="form" novalidate>
                <div class="login-field">
                    <label for="f_loja_login">Usuário ou telefone</label>
                    <input
                        type="text"
                        name="loja_login"
                        id="f_loja_login"
                        placeholder="Usuário ou número de telefone da loja"
                        autocomplete="username"
                        autofocus
                    >
                </div>

                <div class="login-field">
                    <label for="f_loja_password">Senha</label>
                    <div class="password-field">
                        <input
                            type="password"
                            name="loja_password"
                            id="f_loja_password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-password"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >
                            <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.9 5.2A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6" />
                            </svg>
                        </button>
                    </div>
                </div>

                <p id="mensagem" role="alert" aria-live="polite"></p>

                <button type="submit" class="login-submit" id="login-submit">Entrar →</button>
            </form>

            <a href="#" class="login-forgot" id="forgot-password">Esqueceu sua senha?</a>

            <div class="login-cadastro">
                <span>Primeira vez usando o sistema?</span>
                <a href="/cadastro" class="login-cadastro-botao" id="link-cadastro">Cadastrar loja</a>
            </div>
        </section>

        <p class="login-footer">SellFlow · rodando localmente neste computador</p>
    </main>
    <script src="/scripts/log-in.js"></script>
</body>
</html>
