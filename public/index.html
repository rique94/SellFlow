<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <link rel="stylesheet" href="./styles/log-in.css">
</head>
<body>
    <div>
        <h1>RB Outlet</h1>
        <p>Sistemas de pedidos</p>
        <h2>Bem-vindo(a)!</h2>
        <p>Faça login para acessar os pedidos da sua loja</p>

        <form  id="form">
            <input type="text" name="loja_login" id="f_loja_login" placeholder="Usuário ou número de telefone da loja">
            <input type="password" name="loja_password" id="f_loja_password" placeholder="Senha">

            <button type="submit">Entrar →</button>
            <p id="mensagem"></p>
        </form>
        
        <a href="http://localhost:3000/recuperacao-conta">Esqueceu sua senha?</a>
    </div>
</body>
<script src="./scripts/log-in.js"></script>
</html>
